name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: chat_app
          POSTGRES_PASSWORD: chat_app
          POSTGRES_DB: chat_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_app -d chat_app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      VITE_API_BASE_URL: /api
      DATABASE_URL: postgres://chat_app:chat_app@localhost:5432/chat_app
      TEST_DATABASE_URL: postgres://chat_app:chat_app@localhost:5432/chat_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build a clean database from migrations
        run: pnpm build:packages && pnpm db:migrate && pnpm db:seed

      - name: Check generated database types against the migrated schema
        run: pnpm --filter backend db:types:check

      - name: Verify repository
        run: pnpm verify
