services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: chat_app
      POSTGRES_PASSWORD: chat_app
      POSTGRES_DB: chat_app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_app -d chat_app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
